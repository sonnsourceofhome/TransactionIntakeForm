<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Transaction Intake Form – Source Home Group</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,700;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0a0a0a;
      --card: #111111;
      --border: #252525;
      --border-hover: #3a3a3a;
      --accent: #c9a84c;
      --accent-light: #e8c97a;
      --accent-dim: rgba(201,168,76,0.12);
      --text: #f0ece4;
      --muted: #6b6660;
      --muted2: #9a9590;
      --input-bg: #161616;
      --buyer: #c9a84c;
      --listing: #c9a84c;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'DM Sans', sans-serif;
      font-weight: 300;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 52px 20px;
      background-image:
        radial-gradient(ellipse at 15% 85%, rgba(201,168,76,0.06) 0%, transparent 55%),
        radial-gradient(ellipse at 85% 15%, rgba(201,168,76,0.04) 0%, transparent 50%),
        url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%23ffffff' fill-opacity='0.01'%3E%3Cpath d='M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E");
    }

    .wrapper {
      width: 100%;
      max-width: 580px;
      animation: fadeUp 0.7s cubic-bezier(0.22, 1, 0.36, 1) both;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(28px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Header */
    .header {
      text-align: center;
      margin-bottom: 40px;
    }

    .wordmark {
      display: inline-flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 24px;
    }

    .wordmark .line {
      width: 40px;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--accent));
    }

    .wordmark .line.right {
      background: linear-gradient(90deg, var(--accent), transparent);
    }

    .wordmark span {
      font-size: 9px;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      color: var(--accent);
      font-weight: 500;
    }

    .header h1 {
      font-family: 'Playfair Display', serif;
      font-size: 44px;
      font-weight: 700;
      line-height: 1.1;
      color: var(--text);
      margin-bottom: 4px;
    }

    .header h1 em {
      font-style: italic;
      font-weight: 500;
      color: var(--accent);
    }

    .header p {
      color: var(--muted2);
      font-size: 13px;
      margin-top: 12px;
      letter-spacing: 0.02em;
    }

    /* Toggle */
    .type-toggle {
      display: grid;
      grid-template-columns: 1fr 1fr;
      border: 1px solid var(--border);
      border-radius: 10px;
      overflow: hidden;
      margin-bottom: 24px;
      background: var(--card);
    }

    .type-btn {
      padding: 13px 20px;
      background: transparent;
      border: none;
      cursor: pointer;
      font-family: 'DM Sans', sans-serif;
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--muted);
      transition: all 0.3s;
      position: relative;
    }

    .type-btn:first-child { border-right: 1px solid var(--border); }

    .type-btn.active {
      background: var(--accent-dim);
      color: var(--accent);
    }

    .type-btn.active::after {
      content: '';
      position: absolute;
      bottom: 0; left: 0; right: 0;
      height: 2px;
      background: var(--accent);
    }

    /* Card */
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 40px;
      position: relative;
      overflow: hidden;
      box-shadow:
        0 0 0 1px rgba(201,168,76,0.05),
        0 24px 64px rgba(0,0,0,0.6);
    }

    .card::before {
      content: '';
      position: absolute;
      top: 0; left: 15%; right: 15%;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--accent), transparent);
    }

    /* Corner ornament */
    .card::after {
      content: '';
      position: absolute;
      bottom: -60px; right: -60px;
      width: 180px;
      height: 180px;
      border: 1px solid rgba(201,168,76,0.06);
      border-radius: 50%;
      pointer-events: none;
    }

    .section-label {
      font-size: 9px;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      color: var(--accent);
      font-weight: 500;
      margin-bottom: 18px;
      margin-top: 30px;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .section-label::after {
      content: '';
      flex: 1;
      height: 1px;
      background: linear-gradient(90deg, var(--border), transparent);
    }

    .section-label:first-child { margin-top: 0; }

    .row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-bottom: 16px;
    }

    .field:last-child { margin-bottom: 0; }

    label {
      font-size: 10px;
      font-weight: 500;
      color: var(--muted);
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    input, select {
      background: var(--input-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 13px 16px;
      color: var(--text);
      font-family: 'DM Sans', sans-serif;
      font-size: 14px;
      font-weight: 300;
      outline: none;
      transition: border-color 0.25s, box-shadow 0.25s, background 0.25s;
      width: 100%;
      appearance: none;
    }

    input::placeholder { color: #2e2e2e; }

    input:focus, select:focus {
      border-color: var(--accent);
      background: #181818;
      box-shadow: 0 0 0 3px rgba(201,168,76,0.1);
    }

    input[type="date"]::-webkit-calendar-picker-indicator {
      filter: invert(0.3) sepia(1) saturate(3) hue-rotate(5deg);
      cursor: pointer;
      opacity: 0.6;
    }

    .select-wrap { position: relative; }

    .select-wrap::after {
      content: '▾';
      position: absolute;
      right: 14px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--accent);
      pointer-events: none;
      font-size: 11px;
    }

    select option { background: #161616; color: var(--text); }

    .divider {
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--border), transparent);
      margin: 30px 0;
    }

    .submit-btn {
      width: 100%;
      padding: 16px;
      background: linear-gradient(135deg, var(--accent), var(--accent-light));
      color: #0a0a0a;
      border: none;
      border-radius: 10px;
      font-family: 'DM Sans', sans-serif;
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      cursor: pointer;
      transition: opacity 0.2s, transform 0.15s, box-shadow 0.2s;
      margin-top: 28px;
      box-shadow: 0 4px 20px rgba(201,168,76,0.25);
    }

    .submit-btn:hover {
      opacity: 0.92;
      box-shadow: 0 6px 28px rgba(201,168,76,0.35);
    }

    .submit-btn:active { transform: scale(0.99); }

    .error-msg {
      font-size: 11px;
      color: #d47a6a;
      display: none;
    }

    input.invalid, select.invalid {
      border-color: #7a3a30;
      box-shadow: 0 0 0 2px rgba(212,122,106,0.1);
    }

    /* Success */
    .success-screen {
      display: none;
      text-align: center;
      padding: 16px 0;
    }

    .success-icon {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      border: 1px solid var(--accent);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      margin: 0 auto 22px;
      color: var(--accent);
      background: var(--accent-dim);
      box-shadow: 0 0 32px rgba(201,168,76,0.15);
    }

    .success-screen h3 {
      font-family: 'Playfair Display', serif;
      font-size: 26px;
      font-weight: 700;
      color: var(--accent);
      margin-bottom: 10px;
    }

    .success-screen > p {
      color: var(--muted2);
      font-size: 13px;
      line-height: 1.6;
      margin-bottom: 24px;
    }

    .success-details {
      background: var(--input-bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 18px 22px;
      text-align: left;
      font-size: 13px;
      line-height: 2;
    }

    .detail-row {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      border-bottom: 1px solid var(--border);
      padding: 6px 0;
    }

    .detail-row:last-child { border-bottom: none; }

    .detail-label {
      font-size: 9px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--muted);
      font-weight: 500;
    }

    .detail-value {
      color: var(--text);
      font-size: 13px;
      text-align: right;
      max-width: 60%;
    }

    .new-btn {
      margin-top: 24px;
      padding: 11px 28px;
      background: transparent;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-family: 'DM Sans', sans-serif;
      font-size: 10px;
      font-weight: 500;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--muted);
      cursor: pointer;
      transition: border-color 0.2s, color 0.2s;
    }

    .new-btn:hover { border-color: var(--accent); color: var(--accent); }

    @media (max-width: 480px) {
      .row { grid-template-columns: 1fr; }
      .card { padding: 24px; }
      .header h1 { font-size: 34px; }
    }
  </style>
</head>
<body>
  <div class="wrapper">

    <div class="header">
      <div class="wordmark">
        <div class="line"></div>
        <span>Source Home Group</span>
        <div class="line right"></div>
      </div>
      <h1>Transaction<br><em>Intake Form</em></h1>
      <p>Complete all fields to initiate a new transaction checklist.</p>
    </div>

    <div class="type-toggle">
      <button class="type-btn active" id="btnBuyer" onclick="setType('buyer')">Buyer</button>
      <button class="type-btn" id="btnListing" onclick="setType('listing')">Listing</button>
    </div>

    <div class="card" id="mainCard">

      <div id="formContent">

        <div class="section-label">Client Information</div>

        <div class="row">
          <div class="field">
            <label for="firstName">First Name</label>
            <input type="text" id="firstName" placeholder="Jane"/>
            <span class="error-msg" id="err-firstName">Required</span>
          </div>
          <div class="field">
            <label for="lastName">Last Name</label>
            <input type="text" id="lastName" placeholder="Smith"/>
            <span class="error-msg" id="err-lastName">Required</span>
          </div>
        </div>

        <div class="section-label">Property Details</div>

        <div class="field">
          <label for="address">Property Address</label>
          <input type="text" id="address" placeholder="123 Maple Street, Austin, TX 78701"/>
          <span class="error-msg" id="err-address">Required</span>
        </div>

        <div class="section-label">Transaction Details</div>

        <div class="row">
          <div class="field">
            <label for="agent">Assigned Agent</label>
            <div class="select-wrap">
              <select id="agent">
                <option value="" disabled selected>Select agent</option>
                <option value="Cody Walker">Cody Walker</option>
                <option value="Drew Wolfe">Drew Wolfe</option>
                <option value="Cody Walker & Drew Wolfe">Cody & Drew</option>
              </select>
            </div>
            <span class="error-msg" id="err-agent">Required</span>
          </div>
          <div class="field">
            <label for="closingDate">Closing Date</label>
            <input type="date" id="closingDate"/>
            <span class="error-msg" id="err-closingDate">Required</span>
          </div>
        </div>

        <div class="divider"></div>

        <button class="submit-btn" onclick="handleSubmit()">Submit Transaction</button>
      </div>

      <!-- Success Screen -->
      <div class="success-screen" id="successScreen">
        <div class="success-icon">✓</div>
        <h3>Transaction Submitted</h3>
        <p id="successDesc"></p>
        <div class="success-details" id="successDetails"></div>
        <button class="new-btn" onclick="resetForm()">New Submission</button>
      </div>

    </div>
  </div>

  <script>
    let currentType = 'buyer';

    function setType(type) {
      currentType = type;
      document.getElementById('btnBuyer').className = type === 'buyer' ? 'type-btn active' : 'type-btn';
      document.getElementById('btnListing').className = type === 'listing' ? 'type-btn active' : 'type-btn';
    }

    function validate() {
      const fields = ['firstName', 'lastName', 'address', 'agent', 'closingDate'];
      let valid = true;
      fields.forEach(id => {
        const el = document.getElementById(id);
        const err = document.getElementById('err-' + id);
        if (!el.value.trim()) {
          el.classList.add('invalid');
          err.style.display = 'block';
          valid = false;
        } else {
          el.classList.remove('invalid');
          err.style.display = 'none';
        }
      });
      return valid;
    }

    function daysOffset(date, days) {
      const d = new Date(date);
      d.setDate(d.getDate() + days);
      return d;
    }

    function fmt(date) {
      return date.toLocaleDateString('en-US', { month: 'long', day: 'numeric', year: 'numeric' });
    }

    function isoDate(date) {
      return date.toISOString().split('T')[0];
    }

    function handleSubmit() {
      if (!validate()) return;

      const firstName = document.getElementById('firstName').value.trim();
      const lastName  = document.getElementById('lastName').value.trim();
      const address   = document.getElementById('address').value.trim();
      const agent     = document.getElementById('agent').value;
      const closingDate = document.getElementById('closingDate').value;

      const closing = new Date(closingDate + 'T12:00:00');
      const projectName = `${lastName} - ${address}`;

      const dueDates = {
        'Final Walk Through':            daysOffset(closing, -4),
        'Order Closing Gift':            daysOffset(closing, -12),
        'Call Client to Congratulate':   closing,
        'Send Hand Written Letter':      closing,
        'Post Just Sold on Social Media':closing,
        'Deliver Closing Gift':          closing,
        'Ensure Sale Reflects Online':   closing,
        'Remove from Whiteboard':        closing,
        'Update CRM':                    closing,
        'Thank You Text to Agent':       daysOffset(closing, 1),
        'Start Closed Smart Plan':       closing,
        'Update Closed Spreadsheet':     closing,
        'Go into Revii and Transactions':closing,
        'Create Property File on Google Drive': closing,
      };

      const payload = {
        type: currentType,
        projectName,
        firstName, lastName, address, agent, closingDate,
        dueDates: Object.fromEntries(
          Object.entries(dueDates).map(([k, v]) => [k, isoDate(v)])
        )
      };

      console.log('TRANSACTION PAYLOAD:', JSON.stringify(payload, null, 2));

      // Send to Zapier webhook
      const formData = new FormData();
      Object.entries(payload).forEach(([key, value]) => {
        formData.append(key, typeof value === 'object' ? JSON.stringify(value) : value);
      });
      fetch('https://hooks.zapier.com/hooks/catch/13256633/4y0d6gj/', {
        method: 'POST',
        body: formData
      }).catch(err => console.error('Zapier error:', err));

      // Show success
      document.getElementById('formContent').style.display = 'none';
      document.getElementById('successScreen').style.display = 'block';
      document.getElementById('successDesc').textContent =
        `"${projectName}" has been queued for ${agent}, closing on ${fmt(closing)}.`;

      document.getElementById('successDetails').innerHTML = `
        <div class="detail-row"><span class="detail-label">Type</span><span class="detail-value">${currentType === 'buyer' ? 'Buyer' : 'Listing'}</span></div>
        <div class="detail-row"><span class="detail-label">Client</span><span class="detail-value">${firstName} ${lastName}</span></div>
        <div class="detail-row"><span class="detail-label">Address</span><span class="detail-value">${address}</span></div>
        <div class="detail-row"><span class="detail-label">Agent</span><span class="detail-value">${agent}</span></div>
        <div class="detail-row"><span class="detail-label">Closing Date</span><span class="detail-value">${fmt(closing)}</span></div>
      `;
    }

    function resetForm() {
      document.getElementById('formContent').style.display = 'block';
      document.getElementById('successScreen').style.display = 'none';
      ['firstName','lastName','address','closingDate'].forEach(id => {
        document.getElementById(id).value = '';
        document.getElementById(id).classList.remove('invalid');
        document.getElementById('err-' + id).style.display = 'none';
      });
      document.getElementById('agent').value = '';
    }

    ['firstName','lastName','address','agent','closingDate'].forEach(id => {
      document.getElementById(id).addEventListener('input', () => {
        document.getElementById(id).classList.remove('invalid');
        document.getElementById('err-' + id).style.display = 'none';
      });
    });
  </script>
</body>
</html>
